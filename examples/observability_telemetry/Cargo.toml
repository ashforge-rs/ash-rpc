[package]
name = "observability-telemetry-example"
version = "0.1.0"
edition = "2021"
publish = false
# Make this a standalone package, not part of the workspace
[workspace]
[dependencies]
ash-rpc = { version = "4.2", features = ["axum", "observability", "logging", "prometheus", "opentelemetry"] }
axum = "0.8"
tokio = { version = "1.47", features = ["full"] }
serde_json = "1.0"
tracing = "0.1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
prometheus = { version = "0.14", features = ["process"] }
async-trait = "0.1"
